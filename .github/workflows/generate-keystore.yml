# ============================================================================
# Keystore 生成器
# 手动触发 (workflow_dispatch), 生成 Android 签名 keystore 并提交到仓库
#
# 使用方式:
#   1. 在仓库 Actions 页面选择 "Generate Keystore" workflow
#   2. 点击 "Run workflow"
#   3. 填入 keystore 密码、key 别名、key 密码
#   4. 运行完成后, keystore-base64.txt 和 release-keystore.jks 会被提交到仓库
#
# ⚠️ 安全提示:
#   - 如果仓库是 public, 任何人都能下载 keystore 并伪造你的签名
#   - 强烈建议: 生成后立即把仓库改为 private, 或运行后删除此 workflow + keystore 文件
#   - 更安全的做法是把 keystore 存为 repository secret 而非提交到代码库
# ============================================================================

name: Generate Keystore

on:
  workflow_dispatch:
    inputs:
      keystore_password:
        description: 'Keystore 密码 (storePassword)'
        required: true
        type: string
      key_alias:
        description: 'Key 别名 (如 termux-key)'
        required: true
        default: 'termux-key'
        type: string
      key_password:
        description: 'Key 密码 (keyPassword)'
        required: true
        type: string
      common_name:
        description: '证书 CN (如 hzcsure)'
        required: true
        default: 'hzcsure'
        type: string
      validity_days:
        description: '有效期 (天, 默认 10000 ≈ 27年)'
        required: false
        default: '10000'
        type: string

permissions:
  contents: write

jobs:
  generate-keystore:
    name: Generate & Commit Keystore
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate keystore with keytool
        run: |
          echo "Generating release-keystore.jks ..."

          keytool -genkeypair \
            -keystore release-keystore.jks \
            -storepass "${{ inputs.keystore_password }}" \
            -keypass "${{ inputs.key_password }}" \
            -alias "${{ inputs.key_alias }}" \
            -keyalg RSA \
            -keysize 4096 \
            -validity "${{ inputs.validity_days }}" \
            -dname "CN=${{ inputs.common_name }}, OU=Termux Fork, O=hzcsure, L=Unknown, ST=Unknown, C=CN" \
            -storetype JKS

          echo ""
          echo "=== Keystore info ==="
          keytool -list -v \
            -keystore release-keystore.jks \
            -storepass "${{ inputs.keystore_password }}" \
            -alias "${{ inputs.key_alias }}" \
            | grep -E "Alias|Creation|Entry type|Owner|Valid|SHA256|Signature algorithm" || true

      - name: Base64 encode keystore
        run: |
          # 生成 base64 文本 (单行, 无换行)
          base64 -w 0 release-keystore.jks > keystore-base64.txt

          echo "=== File sizes ==="
          ls -lh release-keystore.jks keystore-base64.txt
          echo ""
          echo "Base64 preview (first 80 chars):"
          head -c 80 keystore-base64.txt
          echo "..."

      - name: Generate setup instructions
        run: |
          cat > KEYSTORE_SETUP.md << 'EOF'
          # Keystore 配置说明

          本文件由 GitHub Actions `Generate Keystore` workflow 自动生成。

          ## 文件说明

          | 文件 | 说明 |
          |------|------|
          | `release-keystore.jks` | 签名密钥文件 (二进制) |
          | `keystore-base64.txt` | base64 编码的密钥 (用于配置 GitHub Secret) |

          ## 配置 Release 签名 Secret

          1. 打开仓库 **Settings → Secrets and variables → Actions**
          2. 添加以下 4 个 Secret:

          | Secret 名称 | 值 |
          |-------------|---|
          | `KEYSTORE_BASE64` | `keystore-base64.txt` 文件的完整内容 |
          | `KEYSTORE_PASSWORD` | 生成时输入的 keystore 密码 |
          | `KEY_ALIAS` | 生成时输入的 key 别名 |
          | `KEY_PASSWORD` | 生成时输入的 key 密码 |

          3. 配置完成后, 打 tag `v0.119.0` 即可触发 Release 工作流自动签名构建

          ## ⚠️ 安全警告

          - **如果仓库是 public, 此 keystore 已暴露!** 任何人可以伪造你的 APK 签名
          - 建议: 配置完 Secret 后删除 `release-keystore.jks` 和 `keystore-base64.txt`
          - 或将仓库设为 private
          EOF

      - name: Commit keystore files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add release-keystore.jks keystore-base64.txt KEYSTORE_SETUP.md

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: generate release keystore for signing

          - Generated release-keystore.jks (RSA 4096, validity ${{ inputs.validity_days }} days)
          - Base64 encoded to keystore-base64.txt for Secret configuration
          - See KEYSTORE_SETUP.md for instructions"

            git push
            echo ""
            echo "=== Committed files ==="
            git show --stat HEAD
          fi

      - name: Upload keystore as artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: keystore-backup
          path: |
            release-keystore.jks
            keystore-base64.txt
            KEYSTORE_SETUP.md
          retention-days: 30

      - name: Summary
        run: |
          echo "## Keystore 生成完成 ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 项目 | 值 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Key 别名 | \`${{ inputs.key_alias }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 有效期 | ${{ inputs.validity_days }} 天 |" >> $GITHUB_STEP_SUMMARY
          echo "| CN | ${{ inputs.common_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 下一步" >> $GITHUB_STEP_SUMMARY
          echo "1. 复制 \`keystore-base64.txt\` 内容" >> $GITHUB_STEP_SUMMARY
          echo "2. 到 **Settings → Secrets → Actions** 添加 \`KEYSTORE_BASE64\` Secret" >> $GITHUB_STEP_SUMMARY
          echo "3. 添加其余 3 个 Secret (\`KEYSTORE_PASSWORD\`, \`KEY_ALIAS\`, \`KEY_PASSWORD\`)" >> $GITHUB_STEP_SUMMARY
          echo "4. 打 tag 触发 Release: \`git tag v0.119.0 && git push origin v0.119.0\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ⚠️ 安全提示" >> $GITHUB_STEP_SUMMARY
          echo "如果仓库是 public, keystore 已暴露。建议配置完 Secret 后删除 \`release-keystore.jks\` 和 \`keystore-base64.txt\`。" >> $GITHUB_STEP_SUMMARY
