# ============================================================================
# Build TV Decoy (透明前台诱饵 app)
# 触发: 改动 tvdecoy/** 或本 workflow 时自动构建；也支持手动 workflow_dispatch
# 产出: debug 签名 APK（可直接 adb install 到 TV）
# 说明: 复用 termux CI runner 预装的 JDK17 + Android SDK，无需本地编译环境
# ============================================================================

name: Build TV Decoy

on:
  push:
    paths:
      - 'tvdecoy/**'
      - '.github/workflows/build-decoy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build decoy APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew :tvdecoy:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tvdecoy-apk
          path: tvdecoy/build/outputs/apk/debug/*.apk
          retention-days: 30
