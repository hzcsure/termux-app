# ============================================================================
# CI: 自动构建 + 单元测试
# 触发条件: push 到 master/main/开发分支, 以及针对 master 的 Pull Request
# 基于 termux-app 原始 debug_build.yml 增强: 加入单元测试、lint、缓存
# ============================================================================

name: CI Build & Test

on:
  push:
    branches:
      - master
      - main
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - master
      - main

# 同一分支新 push 时取消旧 run, 省 runner 时间
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: 单元测试 + Lint (快速反馈, 不编译 native)
  # ---------------------------------------------------------------------------
  test:
    name: Unit Test & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' && github.ref != 'refs/heads/main' }}

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Run Lint
        run: ./gradlew lintDebug --no-daemon

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            **/build/reports/tests/
            **/build/reports/lint-results-*.html
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Job 2: 构建 Debug APK (矩阵: 两种 package variant)
  # 依赖 test 通过
  # ---------------------------------------------------------------------------
  build:
    name: Build Debug APK (${{ matrix.package_variant }})
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        package_variant: [ apt-android-7, apt-android-5 ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' && github.ref != 'refs/heads/main' }}

      - name: Build APKs
        shell: bash {0}
        env:
          TERMUX_PACKAGE_VARIANT: ${{ matrix.package_variant }}
        run: |
          exit_on_error() { echo "::error::$1"; exit 1; }

          echo "Setting build vars"

          # PR 用 head sha, push 用默认 sha
          if [ "$GITHUB_EVENT_NAME" == "pull_request" ]; then
            GITHUB_SHA="${{ github.event.pull_request.head.sha }}"
          fi

          # versionName = v<current>+<commit_hash>
          CURRENT_VERSION_NAME_REGEX='\s+versionName "([^"]+)"$'
          CURRENT_VERSION_NAME="$(grep -m 1 -E "$CURRENT_VERSION_NAME_REGEX" ./app/build.gradle | sed -r "s/$CURRENT_VERSION_NAME_REGEX/\1/")"
          RELEASE_VERSION_NAME="v$CURRENT_VERSION_NAME+${GITHUB_SHA:0:7}"

          APK_DIR_PATH="./app/build/outputs/apk/debug"
          APK_VERSION_TAG="$RELEASE_VERSION_NAME-${{ matrix.package_variant }}-github-debug"
          APK_BASENAME_PREFIX="termux-app_$APK_VERSION_TAG"

          echo "APK_DIR_PATH=$APK_DIR_PATH" >> $GITHUB_ENV
          echo "APK_VERSION_TAG=$APK_VERSION_TAG" >> $GITHUB_ENV
          echo "APK_BASENAME_PREFIX=$APK_BASENAME_PREFIX" >> $GITHUB_ENV

          export TERMUX_APP_VERSION_NAME="${RELEASE_VERSION_NAME/v/}"
          export TERMUX_APK_VERSION_TAG="$APK_VERSION_TAG"
          export TERMUX_PACKAGE_VARIANT="${{ matrix.package_variant }}"

          echo "Downloading bootstrap zips for NDK build"
          ./gradlew downloadBootstraps --no-daemon

          echo "Building APKs for '$APK_VERSION_TAG'"
          ./gradlew assembleDebug --no-daemon || exit_on_error "Build failed for '$APK_VERSION_TAG'"

      - name: Validate APKs exist
        shell: bash
        run: |
          for abi in universal arm64-v8a armeabi-v7a x86_64 x86; do
            if ! test -f "${{ env.APK_DIR_PATH }}/${{ env.APK_BASENAME_PREFIX }}_$abi.apk"; then
              echo "::error::Missing APK: ${{ env.APK_BASENAME_PREFIX }}_$abi.apk"
              ls -la "${{ env.APK_DIR_PATH }}/"
              exit 1
            fi
          done

      - name: Generate sha256sums
        run: |
          cd "${{ env.APK_DIR_PATH }}"
          sha256sum \
            "${{ env.APK_BASENAME_PREFIX }}_universal.apk" \
            "${{ env.APK_BASENAME_PREFIX }}_arm64-v8a.apk" \
            "${{ env.APK_BASENAME_PREFIX }}_armeabi-v7a.apk" \
            "${{ env.APK_BASENAME_PREFIX }}_x86_64.apk" \
            "${{ env.APK_BASENAME_PREFIX }}_x86.apk" \
            > "${{ env.APK_BASENAME_PREFIX }}_sha256sums"

      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_BASENAME_PREFIX }}_universal
          path: ${{ env.APK_DIR_PATH }}/${{ env.APK_BASENAME_PREFIX }}_universal.apk

      - name: Upload all APKs + checksums
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_BASENAME_PREFIX }}_all
          path: |
            ${{ env.APK_DIR_PATH }}/${{ env.APK_BASENAME_PREFIX }}_*.apk
            ${{ env.APK_DIR_PATH }}/${{ env.APK_BASENAME_PREFIX }}_sha256sums
          retention-days: 30
