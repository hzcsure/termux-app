# ============================================================================
# 代码质量检查 (可选, 轻量级)
# 触发条件: push/PR 到 master
# ============================================================================

name: Code Quality

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Code Quality Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check code style (editorconfig)
        run: |
          # Gradle 自带 check task 会执行 lint + test, 这里只跑 lint 做快速反馈
          ./gradlew lintDebug --no-daemon

      - name: Check Gradle wrapper version
        run: |
          echo "Checking gradle wrapper..."
          cat gradle/wrapper/gradle-wrapper.properties
          echo ""
          DISTRIBUTION_URL=$(grep distributionUrl gradle/wrapper/gradle-wrapper.properties | cut -d'=' -f2-)
          echo "Gradle distribution: $DISTRIBUTION_URL"

      - name: Dependency submission
        uses: gradle/actions/dependency-submission@v4
        with:
          build-root-directory: .
